<section class="sec rv" aria-labelledby="ab"><h2 id="ab">About YourWeek Fitness</h2>
<p>YourWeek Fitness is a free tool that turns your goals, experience, equipment and free days into a weekly workout timetable. There is no account to create and no cost to use. Your answers and your plan stay in your own browser, so you can come back to them whenever you like.</p>
<h3>How weekly workout splits work</h3>
<p>A workout split is the way you divide your training across the week. A full-body split trains every major muscle group in each session, which suits beginners and anyone with only two or three days to spare. An upper/lower split alternates sessions for the upper body and the lower body, so each area recovers while you train the other. A hybrid session combines strength work with a cardio finisher when you want both in one visit. The planner chooses a split based on how many days you pick, how long you have and the types of exercise you enjoy.</p>
<h3>Why recovery matters</h3>
<p>Your body adapts to training while you rest, not while you lift or run. That is why your plan leaves recovery or rest days between harder sessions and avoids stacking similar workouts on consecutive days. A recovery day can be completely off or include an easy walk or gentle stretching. Sleep, regular meals and plenty of water all support the process. If you feel unusually sore, tired or unwell, an extra rest day is sensible, and any exercise that causes pain should be stopped.</p>
<h3>How to use the Exercise Library</h3>
<p>The <a href="#library">Exercise Library</a> lists every movement the planner can use. Search by name or filter by category, such as strength, cardio, core or low-impact, to find something that suits your equipment. Each card shows the difficulty level, the equipment needed, step-by-step instructions and an alternative if you want an easier or different option. You can also swap any exercise inside your timetable with the Replace button, so the plan always feels right for you.</p>
<p>Start with a weight or pace that feels comfortable, focus on good form before adding difficulty, and build up gradually over several weeks. Consistency matters more than any single session, so choose days you can realistically keep. Ready to begin? <a href="#planner">Create your free plan</a>.</p></section>

return`<div class="${cl}${op[i]&&!swapMode?" open":""}"${sw}><button class="hd" ${swapMode?"":`data-act="tog" data-i="${i}" aria-expanded="${!!op[i]}"`}><span class="di">${ico(TI[s.t])}</span><span><span class="dn">${s.d.toUpperCase()}</span><h3 style="margin:0">${TT(s,P.a)}</h3><span class="foc" style="display:block">${foc(s)}</span><span class="tags"><span class="pill">${s.mins} min</span><span class="pill o">${eqb(s)}</span><span class="pill o"><span class="bars" aria-hidden="true">${"▮".repeat(k+1)+"▯".repeat(2-k)}</span> ${IN[k]}</span></span></span><span class="chev">›</span></button>${swapMode?"":`<button class="dnb noprint${dn?" on":""}" data-act="done" data-i="${i}" aria-pressed="${!!dn}" aria-label="Mark ${s.d} as completed">${ico("check")}</button>`}<div class="bd"><div><div class="bdi">${wu}${s.ex.map((x,j)=>{const e=X[x.id],al=X[e.alt];return`<div class="ex"><div class="exh"><b>${e.n}</b><span class="pill">${dose(e,x.m)}</span></div><p>${e.d}</p><p class="mu sm">${LV[e.l]} · ${EQ[e.eq]}${al?` · Alternative: ${al.n}`:""}</p><button class="lk noprint" data-act="rep" data-i="${i}" data-j="${j}">Replace exercise</button></div>`}).join("")}${cdn}</div></div></div></div>`}
function planV(){P.done=P.done||{};const ac=P.days.filter(d=>d.t!="rest"),dn=ac.filter(d=>P.done[d.d]).length;
return`<div class="wrap"><div class="ph2"><div><h2 style="margin:0">Your week</h2><p class="mu sm" style="margin:.2rem 0 0">${ac.length} sessions · ${P.a.dur} min · saved on this device</p></div><div class="pg"><b>${dn}/${ac.length}</b><span class="mu sm"> done</span></div></div><div class="prog" aria-hidden="true"><i style="--f:0%;width:${ac.length?dn/ac.length*100:0}%"></i></div>
<div class="bar noprint"><button class="btn s" data-act="regen">${ico("refresh")}Regenerate</button><button class="btn s g" data-act="edit">${ico("tune")}Edit preferences</button><div class="mw"><button class="ic" data-act="more" aria-label="More actions" aria-haspopup="true">${ico("more")}</button><div class="mnu" id="mm"><button data-act="swapmode">${ico("swap")}${swapMode?"Done swapping":"Swap days"}</button><button data-act="print">${ico("print")}Print / save as PDF</button><button data-act="share">${ico("share")}Copy to share</button></div></div></div>
${swapMode?`<p class="mu sm noprint">Tap two days to swap them.</p>`:""}<div class="grid days">${P.days.map(card).join("")}</div><p class="mu sm">General fitness information only, not medical advice. Stop if anything hurts.</p></div>`}
const CATS=[["all","All"],["str","Strength"],["car","Cardio"],["mob","Mobility and flexibility"],["core","Core"],["bw","Bodyweight"],["gym","Gym"],["low","Low-impact"]];
function libList(){const q=($("#q")?.value||"").toLowerCase(),f={all:()=>1,str:e=>["legs","push","pull","core","full"].includes(e.pat),car:e=>e.pat=="cardio",mob:e=>["mob","flex"].includes(e.pat),core:e=>e.pat=="core",bw:e=>e.eq=="none"&&!["cardio","mob","flex"].includes(e.pat),gym:e=>e.eq=="gym",low:e=>!e.f.includes("i")}[lc],r=EX.filter(e=>f(e)&&(e.n+e.d).toLowerCase().includes(q));
return r.length?r.map(e=>`<details class="card"><summary><span class="di s">${ico(PI[e.pat])}</span><span><b>${e.n}</b><span class="mu sm" style="display:block">${PL[e.pat]}</span><span class="tags"><span class="pill">${LV[e.l]}</span><span class="pill">${EQ[e.eq]}</span></span></span><span class="chev">›</span></summary><div class="xb"><p>${e.d}</p><p class="mu sm">Suggested: ${dose(e)}${X[e.alt]?` · Alternative: ${X[e.alt].n}`:""}</p></div></details>`).join(""):`<div class="card empty"><div>${ico("core")}</div><h3>No exercises match</h3><p class="mu sm">Try a different search or category.</p><button class="btn s" data-act="cat" data-v="all">Show all exercises</button></div>`}
function libV(){return`<div class="wrap narrow"><h2>Exercise library</h2><p class="mu">Browse ${EX.length} exercises. Tap one for instructions.</p><input type="search" id="q" placeholder="Search exercises" aria-label="Search exercises"><div class="cats" id="cats">${catsH()}</div><div class="grid" id="lst">${libList()}</div></div>`}
const catsH=()=>CATS.map(c=>`<button class="chip${lc==c[0]?" on":""}" data-act="cat" data-v="${c[0]}">${c[1]}</button>`).join("");
const doc=(t,b)=>`<div class="wrap narrow"><h2>${t}</h2><p class="mu sm">Last updated: 20 November 2026</p>${b}</div>`;
function privV(){return doc("Privacy Policy",`<p>YourWeek Fitness does not require an account and does not ask for your name, email address or health details to build a plan.</p>
<h3>Information stored on your device</h3><p>Your answers, your timetable, your completed-session ticks and your light or dark mode choice are saved in your browser’s local storage on your own device. We do not receive this information. You can remove it at any time by clearing this site’s data in your browser.</p>
<h3>Cookies</h3><p>The planner itself does not need cookies to work. Third-party services used on this site, including advertising services, may set cookies or use similar technologies. You can control or delete cookies in your browser settings.</p>
<h3>Advertising and third-party services</h3><p>We intend to show advertising from third-party ad networks, including Google AdSense. Third-party vendors, including Google, use cookies to serve ads based on a person’s previous visits to this and other websites. Google’s use of advertising cookies enables it and its partners to serve ads based on visits to this site and other sites on the internet. You can opt out of personalised advertising by visiting <a href="https://adssettings.google.com" rel="noopener">Google Ads Settings</a> or <a href="https://www.aboutads.info" rel="noopener">aboutads.info</a>. Where the law requires it, personalised advertising will only be shown with your consent.</p>
<p>This site also loads its typeface from Google Fonts, so your browser requests font files from Google’s servers.</p>
<h3>Children</h3><p>This site is not directed at children under 13 and we do not knowingly collect their personal information.</p>
<h3>Changes</h3><p>We may update this policy. The date above shows when it was last changed. See also our <a href="#disclaimer">Fitness Disclaimer</a>.</p>`)}
function disV(){return doc("Fitness Disclaimer",`<p>YourWeek Fitness provides general fitness information for educational purposes only. It is not medical advice, and it does not replace advice from a qualified doctor, physiotherapist or fitness professional.</p>
<p><b>Consult a doctor before starting any exercise program</b>, especially if you are pregnant, are recovering from illness or surgery, have an injury, or have a heart, joint, breathing or other health condition.</p>
<h3>Exercise safely</h3><p>Stop immediately and seek medical help if you feel chest pain, dizziness, unusual shortness of breath or sharp pain. Warm up first, use controlled form, choose weights you can manage, and use a spotter or safety bars for heavy barbell exercises.</p>
<h3>No guarantees</h3><p>Timetables are generated from the answers you give and are not tailored to your medical history. Results vary between people and cannot be guaranteed. You exercise at your own risk. The planner will not create a plan if you say you have an injury or condition that needs individual professional guidance.</p>
<p>See also our <a href="#privacy">Privacy Policy</a>.</p>`)}
// ---------- app ----------
function rd(){$("#app").innerHTML=({home:homeV,planner:plannerV,plan:planV,library:libV,privacy:privV,disclaimer:disV})[view]();["home","planner","library"].forEach(v=>$("#n-"+v).classList.toggle("on",v==view||(view=="plan"&&v=="planner")));rv()}
function rv(){const e=[...document.querySelectorAll(".rv")];if(!("IntersectionObserver"in window))return e.forEach(x=>x.classList.add("vis"));const o=new IntersectionObserver(l=>l.forEach(y=>{if(y.isIntersecting){y.target.classList.add("vis");o.unobserve(y.target)}}),{threshold:.1});e.forEach(x=>o.observe(x))}
function route(){const h=location.hash.slice(1)||"home";view=["home","planner","plan","library","privacy","disclaimer"].includes(h)?h:"home";if(view=="plan"&&!P)view="planner";$("#hd").classList.remove("open");rd();scrollTo(0,0)}
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function make(){P=gen(A);sv("yw_plan",P);op={};swapMode=false;swapSel=null}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-act]");if(!t)return;if(t.dataset.act!="more")$("#mm")?.classList.remove("show");const a=t.dataset.act,i=+t.dataset.i,j=+t.dataset.j,s=ST[step];
if(a=="theme"){const d=document.documentElement,dark=d.dataset.theme=="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches),n=dark?"light":"dark";d.dataset.theme=n;sv("yw_th",n)}
else if(a=="opt"){const v=s.o[i][0];if(s.m){const x=A[s.k],k=x.indexOf(v);k<0?x.push(v):x.splice(k,1)}else A[s.k]=v;sv("yw_ans",A);rd()}
else if(a=="gear"){const x=A.gear,v=GEAR[i][0],k=x.indexOf(v);k<0?x.push(v):x.splice(k,1);sv("yw_ans",A);rd()}
else if(a=="back"){step--;anim=1;rd();scrollTo(0,0)}
else if(a=="unblock"){blocked=false;rd()}
else if(a=="next"){if(!s.opt&&!(s.m?A[s.k].length:A[s.k]))return toast("Choose an option to continue.");
if(s.k=="loc"&&A.loc=="home1"&&!A.gear.length&&!confirm("No equipment selected. Continue with bodyweight exercises only?"))return;
if(step<ST.length-1){step++;anim=1;rd();scrollTo(0,0);return}
A.med=$("#med").checked;sv("yw_ans",A);if(A.med){blocked=true;rd();return}
$("#app").innerHTML=`<div class="wrap narrow center"><div class="spin"></div><h2>Building your personalised weekly timetable…</h2></div>`;
setTimeout(()=>{make();location.hash=view=="plan"?"":"plan";if(view!="plan")return;route()},1400)}
else if(a=="tog"){op[i]=!op[i];t.closest(".day").classList.toggle("open",op[i]);t.setAttribute("aria-expanded",op[i])}
else if(a=="menu"){const h=$("#hd");h.classList.toggle("open");t.setAttribute("aria-expanded",h.classList.contains("open"))}
else if(a=="gocat"){lc=t.dataset.v}
else if(a=="rep"){const d=P.days[i],cur=d.ex[j],e=pick(P.a,[X[cur.id].pat],d.ex.map(x=>x.id),{});if(!e)return toast("No other suitable exercise for your setup.");d.ex[j]={id:e.id,m:cur.m};sv("yw_plan",P);rd()}
else if(a=="done"){P.done=P.done||{};const d=P.days[i].d;P.done[d]=!P.done[d];sv("yw_plan",P);rd()}
else if(a=="more"){$("#mm").classList.toggle("show")}
else if(a=="swapmode"){swapMode=!swapMode;swapSel=null;rd()}
else if(a=="swp"){if(swapSel===null)swapSel=i;else{if(swapSel!=i){const x=P.days,n1=x[swapSel].d,n2=x[i].d,tmp=x[swapSel];x[swapSel]={...x[i],d:n1};x[i]={...tmp,d:n2};sv("yw_plan",P);toast("Days swapped.")}swapSel=null}rd()}
else if(a=="regen"){make();rd();toast("New timetable generated.")}
else if(a=="edit"){step=0;location.hash="planner"}
else if(a=="print")print();
else if(a=="share"){const tx="My YourWeek Fitness plan:\n"+P.days.map(d=>d.d+": "+(d.t=="rest"?(d.rec?"Recovery day":"Rest day"):TT(d,P.a)+", "+d.mins+" min")).join("\n");(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast("Plan copied to clipboard."),()=>toast("Copying isn’t available here."))}
else if(a=="cat"){lc=t.dataset.v;$("#cats").innerHTML=catsH();$("#lst").innerHTML=libList()}});
document.addEventListener("input",e=>{if(e.target.id=="q")$("#lst").innerHTML=libList()});
document.addEventListener("click",e=>{if(!e.target.closest("#mm,[data-act=more]"))$("#mm")?.classList.remove("show")});
$("#hd").innerHTML=`<nav aria-label="Main"><a class="logo" href="#home"><span class="mk">${ico("cardio")}</span><span>YourWeek<b> Fitness</b></span></a><div class="links"><a id="n-home" href="#home">Home</a><a id="n-planner" href="#planner">Workout Planner</a><a id="n-library" href="#library">Exercise Library</a></div><button class="ic" data-act="theme" aria-label="Toggle dark mode">${ico("sun")}</button><button class="ic mb" data-act="menu" aria-label="Menu" aria-expanded="false">${ico("menu")}</button></nav>`;
addEventListener("hashchange",route);route();
</script>
